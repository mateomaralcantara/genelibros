name: Fix chapter titles V14.4

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-chapter-titles-v14-4.py
      - .github/workflows/fix-chapter-titles-v14-4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-chapter-titles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Patch chapter titles
        run: python3 scripts/fix-chapter-titles-v14-4.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check -- src/lib/editor.ts components/GenerationDashboard.tsx

      - name: Commit verified source fix
        shell: bash
        run: |
          if git diff --quiet -- src/lib/editor.ts components/GenerationDashboard.tsx; then
            echo "No source change to commit."
            exit 0
          fi
          git config user.name "GeneLibros Repair Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/editor.ts components/GenerationDashboard.tsx
          git commit -m "fix: preserve chapter titles across full-book generation"
          git push origin HEAD:main
