name: Production monitor

# Cada 15 minutos comprueba que todas las funciones de producción arrancan.
# Si alguna falla, abre (o actualiza) una issue "🚨 Producción" y GitHub te
# avisa por email. Cuando todo vuelve a estar bien, la cierra sola.
# 0 llamadas a LLM: ninguna petición lleva sesión.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/production-smoke-monitor.mjs
      - .github/workflows/production-monitor.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Production smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for deploy after push
        if: github.event_name == 'push'
        run: sleep 180

      - name: Smoke check
        id: smoke
        continue-on-error: true
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://gene.libroseller.com' }}
          MONITOR_REPORT: monitor-report.json
        run: node scripts/production-smoke-monitor.mjs

      - name: Open, update or close alert issue
        uses: actions/github-script@v7
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const fs = require("fs");
            const title = "🚨 Producción: funciones caídas";
            const label = "production-alert";
            const report = fs.existsSync("monitor-report.json")
              ? JSON.parse(fs.readFileSync("monitor-report.json", "utf8"))
              : null;
            const failed = process.env.SMOKE_OUTCOME !== "success";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: "d73a4a", description: "Alerta automática del monitor de producción" });
            }

            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: label, per_page: 1 });
            const existing = open[0];

            if (failed) {
              const rows = (report?.results || [])
                .filter((r) => !r.healthy)
                .map((r) => `| \`${r.method} ${r.path}\` | ${r.label} | ${r.status || "sin respuesta"} | ${String(r.detail || "").replace(/\|/g, "/")} |`)
                .join("\n");
              const body = [
                `El monitor detectó funciones caídas en **${report?.base || "producción"}** (${report?.checked_at || new Date().toISOString()}).`,
                "",
                "| Endpoint | Qué es | Estado | Detalle |",
                "|---|---|---|---|",
                rows || "| — | No se pudo generar el informe | — | — |",
                "",
                `Una función sana responde 4xx sin sesión; 5xx o sin respuesta indica que no arranca o le falta configuración.`,
                `Detalles: ${runUrl}`,
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Sigue fallando:\n\n${body}` });
              } else {
                await github.rest.issues.create({ ...context.repo, title, body, labels: [label], assignees: [context.repo.owner] });
              }
              core.setFailed(`${report?.failed ?? "?"} comprobaciones fallan`);
            } else if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `✅ Todo vuelve a funcionar (${report?.total ?? ""} comprobaciones OK). ${runUrl}` });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: "closed", state_reason: "completed" });
            }
