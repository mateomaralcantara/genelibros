name: GeneLibros 10/10 Lockfile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genelibros-10-10-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Synchronize package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Repair audited transitive dependencies
        run: npm audit fix --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install from synchronized lock
        run: npm ci --no-audit --no-fund

      - name: GeneLibros 10/10 contract
        run: npm run genelibros:10:test

      - name: Final release gate
        run: npm run genelibros:final:verify

      - name: High severity audit
        run: npm audit --audit-level=high

      - name: Diff check
        run: git diff --check -- package-lock.json

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized."
            exit 0
          fi
          git config user.name "GeneLibros 10/10 Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize production lockfile"
          git push origin HEAD:main
