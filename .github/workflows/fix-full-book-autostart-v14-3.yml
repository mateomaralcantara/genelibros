name: Fix full-book autostart V14.3

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-full-book-autostart-v14-3.py
      - .github/workflows/fix-full-book-autostart-v14-3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-full-book-autostart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Patch App
        run: python3 scripts/fix-full-book-autostart-v14-3.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check -- App.tsx

      - name: Commit verified App fix
        shell: bash
        run: |
          if git diff --quiet -- App.tsx; then
            echo "No App source change to commit."
            exit 0
          fi
          git config user.name "GeneLibros Repair Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "fix: autogenerate full books from creation"
          git push origin HEAD:main
