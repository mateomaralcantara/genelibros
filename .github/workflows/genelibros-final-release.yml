name: Genelibros Final Release

on:
  push:
    branches:
      - main
      - feat/supreme-mission-control-12a
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-release-gate:
    name: Final release gate (0 LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Final Genelibros gate
        run: npm run genelibros:final:verify

      - name: Release summary
        if: always()
        run: |
          echo "### Genelibros Final Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- LLM/provider calls: 0" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node: $(node --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gate: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
